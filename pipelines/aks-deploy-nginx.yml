# ============================================================
# OPTIONAL: DEPLOY AN EXISTING NGINX IMAGE TO AKS
# Steps: validate -> connect to AKS -> deploy -> verify rollout
# Before running: edit workshop-variables.yml and run acr-build-nginx.yml.
# ============================================================

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  # Shared participant settings.
  - template: workshop-variables.yml
  - name: imageTag
    value: latest

steps:
  - template: templates/validate-workshop-settings.yml
    parameters:
      requireAks: true
  - task: AzureCLI@2
    displayName: Deploy latest Nginx image to AKS
    inputs:
      azureSubscription: $(azureSubscription)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az aks get-credentials \
          --resource-group "$(aksResourceGroup)" \
          --name "$(aksClusterName)" \
          --overwrite-existing

        kubectl apply -f - <<EOF
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: $(nginxWorkloadName)
          namespace: $(aksNamespace)
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: $(nginxWorkloadName)
          template:
            metadata:
              labels:
                app: $(nginxWorkloadName)
            spec:
              containers:
                - name: nginx
                  image: $(acrName).azurecr.io/$(imageRepository):$(imageTag)
                  ports:
                    - containerPort: 80
                  readinessProbe:
                    httpGet:
                      path: /
                      port: 80
                    initialDelaySeconds: 5
                    periodSeconds: 10
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: $(nginxWorkloadName)
          namespace: $(aksNamespace)
        spec:
          type: ClusterIP
          selector:
            app: $(nginxWorkloadName)
          ports:
            - port: 80
              targetPort: 80
        EOF

        kubectl rollout restart "deployment/$(nginxWorkloadName)" --namespace "$(aksNamespace)"
        if ! kubectl rollout status "deployment/$(nginxWorkloadName)" --namespace "$(aksNamespace)" --timeout 180s; then
          kubectl get pods --namespace "$(aksNamespace)" --output wide
          kubectl describe deployment "$(nginxWorkloadName)" --namespace "$(aksNamespace)"
          kubectl describe pods --namespace "$(aksNamespace)" --selector "app=$(nginxWorkloadName)"
          kubectl logs --namespace "$(aksNamespace)" --selector "app=$(nginxWorkloadName)" --tail 100 || true
          exit 1
        fi
        kubectl get deployment,pods,service --namespace "$(aksNamespace)" --selector "app=$(nginxWorkloadName)"
  - bash: |
      echo "Deployed image: $(acrName).azurecr.io/$(imageRepository):$(imageTag)"
      echo "Namespace: $(aksNamespace)"
    displayName: Show deployment result
